<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="description" content="Offline gamified academy: from beginner to pro in Pharma GxP IT, software validation (GAMP 5), data integrity (ALCOA+), networking, cloud and security.">
  <title>Pharma GxP IT Academy</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
</head>
<body>
  <header class="app-header">
    <a href="#" class="logo" onclick="setView('dashboard'); return false;">
      <div class="logo-icon" style="padding:0;overflow:hidden"><img src="./assets/icon-192.png" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:8px"></div>
      <span>Pharma GxP IT Academy</span>
    </a>
    <div class="header-stats">
      <div class="stat-pill" id="online-status" title="Connection status">…</div>
      <div class="stat-pill">⭐ XP <span class="value" id="header-xp">0</span></div>
      <div class="stat-pill">Level <span class="value" id="header-level">Beginner</span></div>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="dashboard" onclick="setView('dashboard')">Dashboard</button>
      <button class="nav-tab" data-view="achievements" onclick="setView('achievements')">Achievements</button>
      <button class="nav-tab" data-view="settings" onclick="setView('settings')">Settings</button>
    </nav>
  </header>

  <main class="app-main">
    <aside class="sidebar">
      <div class="card">
        <div class="card-title">Modules</div>
        <div id="module-list"></div>
      </div>
    </aside>
    <section class="content-area" id="content-area">
      <!-- dynamic content -->
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="./js/content.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
