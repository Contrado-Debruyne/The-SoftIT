<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f9f7f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="The SoftIT Academy — offline learning from beginner to pro.">
  <title>The SoftIT Academy</title>
  <style>
    html,body{background:#f7f3ee;color:#1c1917;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0}
    #css-fail{display:none;margin:1rem;padding:1rem;background:#fef2f2;border-radius:12px;color:#9a6b6b}
  </style>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css" id="main-css">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <div id="css-fail"><strong>Stylesheet missing.</strong> Upload <code>styles.css</code> next to this file, and open the GitHub Pages URL (not raw GitHub).</div>
  <header class="app-header">
    <a href="#" class="logo" onclick="try{setView('dashboard')}catch(e){};return false;">
      <div class="logo-icon"><img src="icon-192.png" alt=""></div>
      <span>The SoftIT Academy</span>
    </a>
    <div class="header-stats">
      <div class="stat-pill" id="online-status">…</div>
      <div class="stat-pill">⭐ XP <span class="value" id="header-xp">0</span></div>
      <div class="stat-pill">Level <span class="value" id="header-level">Beginner</span></div>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="dashboard" onclick="try{setView('dashboard')}catch(e){}">Dashboard</button>
      <button class="nav-tab" data-view="achievements" onclick="try{setView('achievements')}catch(e){}">Achievements</button>
      <button class="nav-tab" data-view="settings" onclick="try{setView('settings')}catch(e){}">Settings</button>
    </nav>
  </header>
  <main class="app-main">
    <aside class="sidebar">
      <div class="card"><div class="card-title">Modules</div><div id="module-list"></div></div>
    </aside>
    <section class="content-area" id="content-area">
      <div class="card" style="color:#a8a29e">Loading…</div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    document.getElementById('main-css').onerror=function(){document.getElementById('css-fail').style.display='block'};
  </script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
